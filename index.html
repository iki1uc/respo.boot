<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QI.engine · Controller</title>

<!-- Stage -->
<link rel="stylesheet" href="stage.html">

<!-- Engine + System -->
<script type="module" src="QI.engine/3.js"></script>
<script type="module" src="QI.engine/9.sys"></script>
<script type="module" src="QI.engine/81.sys"></script>
<script type="module" src="QI.engine/com.sys"></script>

<style>
    body {
        background:#05070e;
        color:#d0d9e6;
        font-family:Consolas, monospace;
        padding:20px;
    }
    button {
        margin:5px;
        padding:10px 20px;
        background:#111;
        color:#fff;
        border:1px solid #333;
        cursor:pointer;
    }
</style>
</head>

<body>

<h1>QI.engine · System Controller</h1>

<div id="app"></div>

<button onclick="loadModule('use')">use</button>
<button onclick="loadModule('user')">user</button>
<button onclick="loadModule('home')">home</button>
<button onclick="loadModule('ort')">ort</button>
<button onclick="loadModule('markt')">markt</button>
<button onclick="loadModule('industry')">industry</button>
<button onclick="loadModule('work')">work</button>
<button onclick="loadModule('team')">team</button>
<button onclick="loadModule('koop')">koop</button>

<script>
function loadModule(name){
    document.getElementById("app").innerHTML =
        `<iframe src="${name}.html" style="width:100%;height:90vh;border:none;"></iframe>`;
}
</script>

</body>
</html>
